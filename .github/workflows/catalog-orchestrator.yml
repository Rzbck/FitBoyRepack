name: Catalog Orchestrator

on:
  schedule:
    - cron: '4,9,14,19,24,29,34,39,44,49,54,59 * * * *'
  workflow_run:
    workflows: [CI, Fast New Post Watch, Catalog Refresh, Full Catalog Backfill, Media Enrichment, Steam Reviews Enrichment]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Inspect without launching a worker'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: fitboy-orchestrator
  cancel-in-progress: false

jobs:
  coordinate:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.name != 'CI' || github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with: { ref: main }
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python tools/test_github_orchestrator.py
      - name: Select at most one eligible worker
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          args=()
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          python tools/github_orchestrator.py --repo "$GITHUB_REPOSITORY" "${args[@]}"
