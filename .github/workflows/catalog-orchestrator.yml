name: Catalog Orchestrator

on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Inspect without launching a worker'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: fitboy-orchestrator
  cancel-in-progress: false

jobs:
  coordinate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python tools/test_github_orchestrator.py
      - name: Select at most one eligible worker
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          args=()
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          python tools/github_orchestrator.py --repo "$GITHUB_REPOSITORY" "${args[@]}"
