name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Robot · catalog integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate_catalog.py

  frontend:
    name: Robot · frontend smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check site/assets/app.js
      - run: node --check site/assets/details.js
      - run: python tools/check_site.py

  media-filter:
    name: Robot · details/media parser regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python tools/test_media_filter.py

  python:
    name: Robot · Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile tools/update_catalog.py tools/enrich_media.py tools/test_media_filter.py tools/validate_catalog.py tools/check_site.py

  security-boundary:
    name: Robot · forbidden-link guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject indexed magnet/download payloads
        shell: bash
        run: |
          if grep -RniE 'magnet:\?|"(magnets|downloads|download_mirrors|torrent_links)"[[:space:]]*:' site/data site/assets 2>/dev/null; then
            echo 'Forbidden direct-download payload detected in static catalog.'
            exit 1
          fi
