name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Robot · catalog integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python tools/test_catalog_classifier.py
      - run: python tools/validate_catalog.py
      - run: python tools/build_site_data.py
      - run: PYTHONPATH=tools python tools/test_public_metadata_export.py
      - run: PYTHONPATH=tools python tools/test_translation_pipeline.py
      - run: bash -n ops/fitboy/install_translation_runtime.sh
      - name: Verify split catalog, health and lazy payloads
        run: |
          python - <<'PY'
          import json, pathlib
          catalog=json.load(open('site/data/catalog.json',encoding='utf-8'))
          health=json.load(open('site/data/health.json',encoding='utf-8'))
          assert catalog['count']==len(catalog['games'])==health['total_games']
          assert health['expected_versions']['media']==7
          assert all((pathlib.Path('site')/g['detail_path']).exists() for g in catalog['games'])
          assert all('year' in g and 'size_mb' in g and 'has_description' in g and 'media_count' in g for g in catalog['games'])
          assert all('metadata_ready' in g and 'canonical_title' in g and 'metadata_genres' in g for g in catalog['games'])
          assert health['expected_versions']['metadata']==1
          print('split payloads',catalog['count'],'pending enrichment',health['enrichment_pending'])
          PY

  frontend:
    name: Robot · frontend V2 smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python tools/build_site_data.py
      - run: node --check site/assets/catalog-api.js
      - run: node --check site/assets/game-identity.js
      - run: node --check site/assets/app.js
      - run: node --check site/assets/details.js
      - run: node --check site/assets/layout-v3.js
      - run: node --check site/assets/media-preview-v7.js
      - run: python tools/check_site.py
      - name: Verify stable game identity semantics
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {
            displayTitle,
            editionTitle,
            effectiveGenreLabels,
          } from './site/assets/game-identity.js';

          const lightLegacy = {
            title: 'Eastern Era – v1.2.0',
            genres: ['Action', 'RPG'],
          };
          const detailLegacy = {
            title: 'Eastern Era – v1.2.0',
            genres: ['Action', 'RPG'],
            details: { description: 'Example' },
          };
          assert.equal(displayTitle(lightLegacy), 'Eastern Era');
          assert.equal(displayTitle(detailLegacy), 'Eastern Era');
          assert.equal(editionTitle(lightLegacy), 'v1.2.0');
          assert.equal(editionTitle(detailLegacy), 'v1.2.0');
          assert.deepEqual(effectiveGenreLabels(lightLegacy), effectiveGenreLabels(detailLegacy));

          const lightEnriched = {
            title: 'Example Game – Deluxe Edition',
            canonical_title: 'Example Game',
            metadata_genres: ['simulation video game', 'role-playing'],
            genres: ['Lifestyle', 'Simulation'],
          };
          const detailEnriched = {
            title: 'Example Game – Deluxe Edition',
            verified_metadata: {
              canonical_title: 'Example Game',
              genres: ['simulation video game', 'role-playing'],
            },
            genres: ['Lifestyle', 'Simulation'],
          };
          assert.equal(displayTitle(lightEnriched), displayTitle(detailEnriched));
          assert.equal(editionTitle(lightEnriched), editionTitle(detailEnriched));
          assert.deepEqual(
            effectiveGenreLabels(lightEnriched),
            ['Simulation', 'RPG', 'Lifestyle'],
          );
          assert.deepEqual(
            effectiveGenreLabels(lightEnriched),
            effectiveGenreLabels(detailEnriched),
          );
          JS
      - name: Verify fixed media grid and preview/full contract
        run: |
          grep -q 'game-sheet-v6.css' site/assets/layout-v3.js
          grep -q 'game-sheet-v7.css' site/assets/layout-v3.js
          grep -q 'media-preview-v7.js' site/assets/layout-v3.js
          grep -q 'media-gif-v6' site/assets/layout-v3.js
          grep -q 'overflow-x:hidden' site/assets/game-sheet-v6.css
          grep -q 'grid-column:span 2' site/assets/game-sheet-v6.css
          grep -q 'detail-tab-nav' site/assets/game-sheet-v7.css
          grep -q 'makeIdentityFacts' site/assets/details.js
          grep -q 'cover-identity-facts' site/assets/game-sheet-v7.css
          grep -q 'cover-details-meta' site/assets/game-sheet-v7.css
          grep -q 'cardDisplayTitle' site/assets/app.js
          grep -q 'cardDisplayTags' site/assets/app.js
          grep -q 'game-identity.js' site/assets/app.js
          grep -q 'identityStable' site/assets/details.js
          grep -q 'effectiveTags' site/assets/app.js
          grep -q 'releasePeriodMatches' site/assets/app.js
          grep -q 'tag-picker-dialog' site/assets/catalog-focus-v3.css
          grep -q 'canonical title first' site/assets/catalog-focus-v3.css
          grep -q 'buildInitialCoverIdentity' site/assets/app.js
          grep -q 'buildDetailLoadingShell' site/assets/app.js
          grep -q 'detail-loading-shell' site/assets/game-sheet-v7.css
          grep -q 'cover-details-initial' site/assets/details.js
          grep -q 'preview_url' site/assets/media-preview-v7.js
          grep -q 'preloadImage' site/assets/media-preview-v7.js
          ! grep -q 'structureMediaGallery' site/assets/layout-v3.js

  browser-runtime:
    name: Robot · real browser runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Seed a verified metadata record for browser contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source=json.load(open('site/data/games.json',encoding='utf-8'))
          first=source['games'][0]
          payload={
              'metadata_version':1,
              'generated_at':'2026-10-02T12:00:00+00:00',
              'minimum_confidence':0.9,
              'count':1,
              'games':{
                  str(first['id']):{
                      'canonical_title':'CI Canonical Game',
                      'release_date':'2024-01-02',
                      'genres':['turn-based strategy video game','role-playing'],
                      'developer':'CI Studio',
                      'publisher':'CI Publisher',
                      'platforms':['Microsoft Windows','Q63184502','Xbox Series X and Series S'],
                      'confidence':0.99,
                      'evidence_urls':['https://www.wikidata.org/wiki/Q123'],
                      'checked_at':'2026-10-02T12:00:00+00:00',
                      'wikidata_id':'Q123',
                  }
              }
          }
          Path('site/data/metadata-enrichment.json').write_text(json.dumps(payload,separators=(',',':'))+'\n',encoding='utf-8')
          PY
      - name: Build deploy-shaped site data
        run: python tools/build_site_data.py
      - name: Boot site in headless Chrome and require V2 UI + deep link
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 -d site >/tmp/fitboy-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break; sleep 0.2; done
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome" || { echo 'No Chrome/Chromium found'; exit 1; }
          run_chrome() {
            timeout 50s "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --blink-settings=imagesEnabled=false --virtual-time-budget=8000 --dump-dom "$1"
          }
          run_chrome http://127.0.0.1:4173/ > /tmp/dom.html
          cards=$(grep -o 'data-game-id=' /tmp/dom.html | wc -l | tr -d ' ')
          echo "Rendered cards: $cards"
          test "$cards" -ge 20
          grep -q 'id="healthPanel"' /tmp/dom.html
          grep -q 'id="yearFilter"' /tmp/dom.html
          grep -q 'id="releasePeriodFilter"' /tmp/dom.html
          grep -q 'id="tagPickerDialog"' /tmp/dom.html
          grep -Fq 'Turn-Based Strategy' /tmp/dom.html
          grep -Fq '>RPG<' /tmp/dom.html
          grep -q 'id="discoveryShell"' /tmp/dom.html
          ! grep -q 'id="catalogStatus" class="catalog-status">Chargement' /tmp/dom.html
          first_id=$(python -c "import json; print(json.load(open('site/data/catalog.json',encoding='utf-8'))['games'][0]['id'])")
          encoded_id=$(python -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=''))" "$first_id")
          run_chrome "http://127.0.0.1:4173/#game=${encoded_id}" > /tmp/game.html
          grep -q 'class="dialog-layout' /tmp/game.html
          grep -Fq "data-game-id=\"${first_id}\"" /tmp/game.html
          grep -q 'dialog-actions' /tmp/game.html
          grep -Fq 'cover-identity-facts' /tmp/game.html
          grep -Fq 'CI Canonical Game' /tmp/game.html
          grep -Fq 'CI Studio' /tmp/game.html
          grep -Fq 'Turn-Based Strategy' /tmp/game.html
          grep -Fq 'RPG' /tmp/game.html
          grep -Fq 'Sortie du jeu' /tmp/game.html
          grep -Fq 'Xbox Series X/S' /tmp/game.html
          grep -Fq 'Données vérifiées' /tmp/game.html
          grep -Fq 'data-identity-stable="true"' /tmp/game.html
          ! grep -Fq 'Q63184502' /tmp/game.html
          ! grep -Fq 'Informations du jeu' /tmp/game.html
          ! grep -Fq 'Enrichi ·' /tmp/game.html
          ! grep -Fq '>Infos</button>' /tmp/game.html

          # Regression: empty legacy payloads still use the stable final geometry,
          # but must exit the loading shell and show the explicit empty state.
          legacy_id=$(python - <<'PY'
          import json
          from pathlib import Path

          catalog=json.load(open('site/data/catalog.json',encoding='utf-8'))
          root=Path('site')
          found=None
          for item in catalog['games']:
              if not item.get('details_ready'):
                  continue
              detail=json.load(open(root/item['detail_path'],encoding='utf-8'))
              details=detail.get('details') if isinstance(detail.get('details'),dict) else {}
              text=str(details.get('description') or '').strip()
              game_features=[str(x or '').strip() for x in details.get('game_features') or []]
              repack_features=[str(x or '').strip() for x in details.get('repack_features') or []]
              media=[
                  x for x in (detail.get('media') or [])
                  if isinstance(x,dict)
                  and isinstance(x.get('url'),str)
                  and x['url'].startswith('https://')
                  and x.get('type') in ('image','gif')
              ]
              if not text and not any(game_features) and not any(repack_features) and not media:
                  found=item['id']
                  break
          assert found, 'no legacy empty-detail regression candidate found'
          print(found)
          PY
          )
          encoded_legacy_id=$(python -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=''))" "$legacy_id")
          run_chrome "http://127.0.0.1:4173/#game=${encoded_legacy_id}" > /tmp/legacy-game.html
          grep -Fq "data-game-id=\"${legacy_id}\"" /tmp/legacy-game.html
          grep -Fq 'Aucun détail enrichi disponible pour cette fiche pour le moment.' /tmp/legacy-game.html
          ! grep -Fq 'Chargement de la fiche détaillée…' /tmp/legacy-game.html
          grep -q 'class="dialog-layout rich-details' /tmp/legacy-game.html
          ! grep -q 'class="dialog-layout rich-details dialog-loading"' /tmp/legacy-game.html
          ! grep -q 'class="detail-loading-shell"' /tmp/legacy-game.html

  media-filter:
    name: Robot · details/media parser regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python tools/test_media_filter.py
      - run: python tools/test_media_v4.py
      - run: python tools/test_media_v5.py
      - run: python tools/test_media_v6.py
      - run: python tools/test_media_v7.py

  local-ai:
    name: Robot · local AI bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python tools/test_llm_client.py
      - run: python tools/test_ai_catalog_bootstrap.py
      - run: python tools/test_fast_metadata_bootstrap.py
      - name: Verify reusable localhost-only service template
        run: |
          grep -q 'LLM_HOST=127.0.0.1' ops/llm/llm.env.example
          grep -q 'OpenAI-compatible' ops/llm/README.md
          grep -q 'MemoryMax=6G' ops/llm/llama-server.service

  python:
    name: Robot · Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m py_compile tools/update_catalog.py tools/catalog_classifier.py tools/check_catalog_classification.py tools/test_catalog_classifier.py tools/enrich_media.py tools/enrich_media_v4.py tools/enrich_media_v5.py tools/enrich_media_v6.py tools/enrich_media_v7.py tools/enrich_media_clustered.py tools/check_feed.py tools/build_site_data.py tools/export_public_metadata.py tools/publish_public_metadata.py tools/test_public_metadata_export.py tools/test_media_filter.py tools/test_media_v4.py tools/test_media_v5.py tools/test_media_v6.py tools/test_media_v7.py tools/validate_catalog.py tools/check_site.py tools/llm_client.py tools/test_llm_client.py tools/ai_catalog_bootstrap.py tools/test_ai_catalog_bootstrap.py tools/fast_metadata_bootstrap.py tools/test_fast_metadata_bootstrap.py tools/translation_autodrain.py tools/export_public_translations.py tools/publish_public_translations.py tools/test_translation_pipeline.py

  security-boundary:
    name: Robot · forbidden-link guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject indexed magnet/download payloads
        shell: bash
        run: |
          if grep -RniE 'magnet:\?|"(magnets|downloads|download_mirrors|torrent_links)"[[:space:]]*:' site/data site/assets 2>/dev/null; then
            echo 'Forbidden direct-download payload detected in static catalog.'
            exit 1
          fi
