name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Robot · catalog integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/test_catalog_classifier.py
      - run: python tools/validate_catalog.py
      - run: python tools/build_site_data.py
      - name: Verify split catalog, health and lazy payloads
        run: |
          python - <<'PY'
          import json, pathlib
          catalog=json.load(open('site/data/catalog.json',encoding='utf-8'))
          health=json.load(open('site/data/health.json',encoding='utf-8'))
          assert catalog['count']==len(catalog['games'])==health['total_games']
          assert health['expected_versions']['media']==7
          assert all((pathlib.Path('site')/g['detail_path']).exists() for g in catalog['games'])
          assert all('year' in g and 'size_mb' in g and 'has_description' in g and 'media_count' in g for g in catalog['games'])
          print('split payloads',catalog['count'],'pending enrichment',health['enrichment_pending'])
          PY

  frontend:
    name: Robot · frontend V2 smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/build_site_data.py
      - run: node --check site/assets/catalog-api.js
      - run: node --check site/assets/app.js
      - run: node --check site/assets/details.js
      - run: node --check site/assets/layout-v3.js
      - run: node --check site/assets/media-preview-v7.js
      - run: python tools/check_site.py
      - name: Verify fixed media grid and preview/full contract
        run: |
          grep -q 'game-sheet-v6.css' site/assets/layout-v3.js
          grep -q 'game-sheet-v7.css' site/assets/layout-v3.js
          grep -q 'media-preview-v7.js' site/assets/layout-v3.js
          grep -q 'media-gif-v6' site/assets/layout-v3.js
          grep -q 'overflow-x:hidden' site/assets/game-sheet-v6.css
          grep -q 'grid-column:span 2' site/assets/game-sheet-v6.css
          grep -q 'detail-tab-nav' site/assets/game-sheet-v7.css
          grep -q 'preview_url' site/assets/media-preview-v7.js
          grep -q 'preloadImage' site/assets/media-preview-v7.js
          ! grep -q 'structureMediaGallery' site/assets/layout-v3.js

  browser-runtime:
    name: Robot · real browser runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build deploy-shaped site data
        run: python tools/build_site_data.py
      - name: Boot site in headless Chrome and require V2 UI + deep link
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 -d site >/tmp/fitboy-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break; sleep 0.2; done
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome" || { echo 'No Chrome/Chromium found'; exit 1; }
          run_chrome() {
            timeout 50s "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --blink-settings=imagesEnabled=false --virtual-time-budget=8000 --dump-dom "$1"
          }
          run_chrome http://127.0.0.1:4173/ > /tmp/dom.html
          cards=$(grep -o 'data-game-id=' /tmp/dom.html | wc -l | tr -d ' ')
          echo "Rendered cards: $cards"
          test "$cards" -ge 20
          grep -q 'id="healthPanel"' /tmp/dom.html
          grep -q 'id="yearFilter"' /tmp/dom.html
          grep -q 'id="discoveryShell"' /tmp/dom.html
          ! grep -q 'id="catalogStatus" class="catalog-status">Chargement' /tmp/dom.html
          first_id=$(python -c "import json; print(json.load(open('site/data/catalog.json',encoding='utf-8'))['games'][0]['id'])")
          encoded_id=$(python -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=''))" "$first_id")
          run_chrome "http://127.0.0.1:4173/#game=${encoded_id}" > /tmp/game.html
          grep -q 'class="dialog-layout' /tmp/game.html
          grep -Fq "data-game-id=\"${first_id}\"" /tmp/game.html
          grep -q 'dialog-actions' /tmp/game.html

  media-filter:
    name: Robot · details/media parser regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python tools/test_media_filter.py
      - run: python tools/test_media_v4.py
      - run: python tools/test_media_v5.py
      - run: python tools/test_media_v6.py
      - run: python tools/test_media_v7.py

  python:
    name: Robot · Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile tools/update_catalog.py tools/catalog_classifier.py tools/check_catalog_classification.py tools/test_catalog_classifier.py tools/enrich_media.py tools/enrich_media_v4.py tools/enrich_media_v5.py tools/enrich_media_v6.py tools/enrich_media_v7.py tools/enrich_media_clustered.py tools/check_feed.py tools/build_site_data.py tools/test_media_filter.py tools/test_media_v4.py tools/test_media_v5.py tools/test_media_v6.py tools/test_media_v7.py tools/validate_catalog.py tools/check_site.py

  security-boundary:
    name: Robot · forbidden-link guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject indexed magnet/download payloads
        shell: bash
        run: |
          if grep -RniE 'magnet:\?|"(magnets|downloads|download_mirrors|torrent_links)"[[:space:]]*:' site/data site/assets 2>/dev/null; then
            echo 'Forbidden direct-download payload detected in static catalog.'
            exit 1
          fi
