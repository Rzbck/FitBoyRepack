name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Robot · catalog integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate_catalog.py

  frontend:
    name: Robot · frontend smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check site/assets/app.js
      - run: python tools/check_site.py

  python:
    name: Robot · Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile tools/update_catalog.py tools/validate_catalog.py tools/check_site.py

  magnet-contract:
    name: Robot · magnet contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allow magnets, reject mirror/torrent payload fields
        shell: bash
        run: |
          if grep -RniE '"(downloads|download_mirrors|torrent_links|torrent_url)"\s*:' site/data 2>/dev/null; then
            echo 'Unexpected download payload field detected. Only magnet_url is allowed.'
            exit 1
          fi
          echo 'Magnet contract OK'
