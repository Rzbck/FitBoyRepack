name: Media Enrichment

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: 'Maximum games to enrich in this run'
        required: false
        default: '360'
      workers:
        description: 'Parallel detail-page workers'
        required: false
        default: '12'
      refresh:
        description: 'Recheck already enriched games'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'tools/enrich_media.py'
      - '.github/workflows/enrich-media.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: catalog-writer
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Enrich screenshots, GIFs and public details
        env:
          BATCH: ${{ github.event.inputs.batch || '360' }}
          WORKERS: ${{ github.event.inputs.workers || '12' }}
          REFRESH: ${{ github.event.inputs.refresh || 'false' }}
        shell: bash
        run: |
          ARGS=(--batch "$BATCH" --workers "$WORKERS")
          if [ "$REFRESH" = "true" ]; then ARGS+=(--refresh); fi
          python tools/enrich_media.py "${ARGS[@]}"
      - name: Validate generated catalog
        run: python tools/validate_catalog.py
      - name: Commit media safely
        id: commit
        shell: bash
        run: |
          echo 'changed=false' >> "$GITHUB_OUTPUT"
          if git diff --quiet -- site/data/games.json; then
            echo 'No media change'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/games.json
          git commit -m 'data: enrich media'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Deploy enriched catalog
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
