name: Media Enrichment

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: 'Maximum games per enrichment round'
        required: false
        default: '480'
      workers:
        description: 'Parallel detail-page workers'
        required: false
        default: '12'
      rounds:
        description: 'Maximum consecutive rounds before yielding the writer lock'
        required: false
        default: '6'
      refresh:
        description: 'Recheck already enriched games'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'tools/enrich_media.py'
      - '.github/workflows/enrich-media.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: catalog-writer
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          # The run may wait behind another catalog writer. Resolve main only
          # after the queue slot is acquired so enrichment never starts stale.
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Enrich screenshots, GIFs and public details in accelerated rounds
        env:
          BATCH: ${{ github.event.inputs.batch || '480' }}
          WORKERS: ${{ github.event.inputs.workers || '12' }}
          ROUNDS: ${{ github.event.inputs.rounds || '6' }}
          REFRESH: ${{ github.event.inputs.refresh || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          for round in $(seq 1 "$ROUNDS"); do
            echo "=== enrichment round ${round}/${ROUNDS} ==="
            args=(--batch "$BATCH" --workers "$WORKERS")
            if [ "$REFRESH" = "true" ]; then args+=(--refresh); fi
            python tools/enrich_media.py "${args[@]}"

            if [ "$REFRESH" = "true" ]; then
              break
            fi

            remaining=$(python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('site/data/games.json').read_text(encoding='utf-8'))
          games=p.get('games',[])
          pending=sum(1 for g in games if g.get('source_url') and (g.get('media_version') != 3 or g.get('details_version') != 1))
          print(pending)
          PY
            )
            echo "pending enrichment after round ${round}: ${remaining}"
            if [ "$remaining" -eq 0 ]; then break; fi
          done
      - name: Validate generated catalog
        run: python tools/validate_catalog.py
      - name: Commit media safely
        id: commit
        shell: bash
        run: |
          echo 'changed=false' >> "$GITHUB_OUTPUT"
          if git diff --quiet -- site/data/games.json; then
            echo 'No media change'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/games.json
          git commit -m 'data: enrich media'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Deploy enriched catalog
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
