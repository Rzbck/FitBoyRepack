name: Fast New Post Watch

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [fitgirl-new-post]

permissions:
  contents: read
  actions: write

concurrency:
  group: feed-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Check RSS signal
        id: feed
        run: python tools/check_feed.py
      - name: Queue the serialized catalog writer
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_COUNT: ${{ steps.feed.outputs.new_count || '0' }}
        shell: bash
        run: |
          pages=1
          if [ "$NEW_COUNT" -gt 0 ]; then pages=3; fi
          echo "RSS/new-page watcher requests ${pages} listing page(s)"
          gh workflow run update-catalog.yml --ref main -f pages="$pages" -f workers=8
