name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/build_site_data.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { ref: main }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - run: python tools/validate_catalog.py
      - run: python tools/build_site_data.py
      - run: python tools/check_site.py
      - run: node --check site/assets/catalog-api.js
      - run: node --check site/assets/game-identity.js
      - run: node --check site/assets/i18n.js
      - run: node --check site/assets/translations.js
      - run: node --check site/assets/app.js
      - run: node --check site/assets/details.js

  deploy:
    needs: verify
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      commit_sha: ${{ steps.version.outputs.sha }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { ref: main }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - name: Build lightweight catalog, health and lazy game payloads
        run: python tools/build_site_data.py
      - name: Remove rich source monolith from public artifact
        run: rm site/data/games.json
      - name: Stamp deployed revision
        id: version
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"; built_at="$(date -u +%FT%TZ)"
          printf '{"commit":"%s","built_at":"%s"}\n' "$sha" "$built_at" > site/version.json
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  healthcheck:
    name: Robot · production Pages health
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify public V2 site, search index, health and lazy detail payload
        shell: bash
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_SHA: ${{ needs.deploy.outputs.commit_sha }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"; nonce="${EXPECTED_SHA:0:12}-$(date +%s)"
          fetch(){ echo "GET ${base}/$1?health=${nonce}"; curl --fail --silent --show-error --location --retry 10 --retry-delay 3 --retry-all-errors --connect-timeout 10 --max-time 45 -H 'Cache-Control: no-cache, no-store, max-age=0' "${base}/$1?health=${nonce}" -o "$2"; }
          fetch index.html /tmp/index.html
          fetch assets/app.js /tmp/app.js
          fetch assets/game-identity.js /tmp/identity.js
          fetch assets/i18n.js /tmp/i18n.js
          fetch assets/translations.js /tmp/translations.js
          fetch assets/catalog-api.js /tmp/api.js
          fetch assets/catalog-v2.css /tmp/v2.css
          fetch data/catalog.json /tmp/catalog.json
          fetch data/search-index.json /tmp/search-index.json
          fetch data/health.json /tmp/health.json
          fetch data/metadata-enrichment.json /tmp/metadata-enrichment.json
          fetch data/translations-fr.json /tmp/translations-fr.json
          fetch version.json /tmp/version.json
          detail_path=$(python - <<'PY'
          import json
          c=json.load(open('/tmp/catalog.json')); s=json.load(open('/tmp/search-index.json')); h=json.load(open('/tmp/health.json'))
          m=json.load(open('/tmp/metadata-enrichment.json')); t=json.load(open('/tmp/translations-fr.json'))
          assert c['count']==len(c['games'])==s['count']==h['total_games'] and c['games']
          assert s['search_index_version']==1 and s['prefixes'] and s['grams']
          assert 'coverage' in h and 'enrichment_pending' in h and 'metadata' in h['coverage']
          assert h['expected_versions']['metadata']==1
          assert m['metadata_version']==1 and m['count']==len(m['games'])
          assert t['translation_version']==1 and t['language']=='fr' and t['count']==len(t['games'])
          assert all('metadata_ready' in game for game in c['games'])
          print(c['games'][0]['detail_path'])
          PY
          )
          fetch "$detail_path" /tmp/detail.json
          grep -q 'searchSuggestions' /tmp/index.html
          grep -q 'searchCandidateIndexes' /tmp/app.js
          grep -q 'effectiveGenreLabels' /tmp/identity.js
          grep -q 'fitboyrepack:language:v1' /tmp/i18n.js
          grep -q 'source_sha256' /tmp/translations.js
          grep -q 'translations-fr.json' /tmp/api.js
          grep -q 'search-index.json' /tmp/api.js
          grep -q 'health.json' /tmp/api.js
          grep -q 'home-card-row' /tmp/v2.css
          grep -q '"source_url"' /tmp/detail.json
          grep -Fq "$EXPECTED_SHA" /tmp/version.json
          echo "Production Pages V2 + verified metadata + FR translation frontend healthy on $EXPECTED_SHA"
          cat /tmp/health.json
