name: Steam Reviews Enrichment

on:
  schedule:
    - cron: '17 * * * *' # backup trigger; first healthy run wins
    - cron: '46 * * * *' # primary trigger
  workflow_dispatch:
    inputs:
      resolve_limit:
        description: 'Maximum Wikidata-linked games to resolve (0-400)'
        default: '300'
      reviews_limit:
        description: 'Maximum Steam review requests (0-160)'
        default: '120'
      fallback_limit:
        description: 'Exact-title fallback lookups (0-40)'
        default: '25'
  push:
    branches: [main]
    paths:
      - 'tools/update_steam_ratings.py'
      - '.github/workflows/steam-ratings.yml'

permissions:
  contents: write
  actions: write

# Shared with catalog refresh and media enrichment; checkout latest main.
concurrency:
  group: catalog-writer
  cancel-in-progress: false

jobs:
  ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Skip redundant scheduled runs after a recent successful batch
        id: cadence
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python tools/steam_schedule_guard.py >> "$GITHUB_OUTPUT"
      - name: Verify keyless review enrichment logic
        if: steps.cadence.outputs.run == 'true'
        run: PYTHONPATH=tools python tools/test_steam_ratings.py
      - name: Enrich larger incremental ratings batch (throttled)
        if: steps.cadence.outputs.run == 'true'
        env:
          RESOLVE_LIMIT: ${{ inputs.resolve_limit || '300' }}
          REVIEWS_LIMIT: ${{ inputs.reviews_limit || '120' }}
          FALLBACK_LIMIT: ${{ inputs.fallback_limit || '25' }}
        run: |
          python tools/update_steam_ratings.py \
            --resolve-limit "$RESOLVE_LIMIT" \
            --reviews-limit "$REVIEWS_LIMIT" \
            --fallback-limit "$FALLBACK_LIMIT" \
            --pause 3.5
      - name: Commit public review cache safely
        if: steps.cadence.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- site/data/steam-ratings.json; then
            echo 'Steam ratings unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/steam-ratings.json
          git commit -m 'data: refresh public Steam reviews gradually'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          # Bot pushes with GITHUB_TOKEN do not trigger the Pages push workflow.
          gh workflow run pages.yml --ref main
