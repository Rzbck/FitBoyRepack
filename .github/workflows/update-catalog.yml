name: Catalog Refresh

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      pages:
        description: 'Newest listing pages to scan'
        required: false
        default: '8'
      workers:
        description: 'Parallel listing-page workers'
        required: false
        default: '8'

permissions:
  contents: write
  actions: write

concurrency:
  group: catalog-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Refresh recent metadata
        env:
          PAGES: ${{ github.event.inputs.pages || '8' }}
          WORKERS: ${{ github.event.inputs.workers || '8' }}
        run: python tools/update_catalog.py --pages "$PAGES" --workers "$WORKERS"
      - name: Validate generated catalog
        run: python tools/validate_catalog.py
      - name: Commit catalog safely
        id: commit
        shell: bash
        run: |
          echo 'changed=false' >> "$GITHUB_OUTPUT"
          if git diff --quiet -- site/data/games.json; then
            echo 'No catalog change'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/games.json
          git commit -m 'data: refresh catalog'

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Trigger immediate enrichment and deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run enrich-media.yml --ref main -f batch=180 -f workers=12 -f refresh=false
          gh workflow run pages.yml --ref main
